<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KANBAN</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
            <nav>
        <div class="right">KANBAN</div>
        <div class="left">
            <button class="Add new Task" id="toggle-modal">Add new task</button>
        </div>
    </nav>

    <section class ="board">
        <div id="todo" class="task-column" >
            <div class="heading">
                <div class="left">To Do</div>
                <div class="right">Count</div>
            </div>
           
        </div>
        <div id="progress" class="task-column">
            <div class="heading">
                <div class="left">In Progress</div>
                <div class="right">Count</div>
            </div>
        </div>
            
       
        <div id="done" class="task-column">
            <div class="heading">
                <div class="left">Done</div>
                <div class="right">Count</div>
            </div>
        </div>
    </section>
</main>
<div class="modal add-new-task">
    <div class="bg"></div>
    <div class="center">
        <input type="text" id="taskInput" placeholder="Task title">
        <textarea id="taskDesc" placeholder="Task Description"></textarea>
        <button id="addtskbtn" class="add-tsk-btn">Create Task</button>
    </div>
</div>


    <script src="script.js"></script>
</body>
</html>
